[package]
name = "pgcdc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
pg_walstream = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2.0.20"
async-trait = "0.1.92"
tracing = "0.1.44"
tokio-postgres = "0.7.18"
clap = { version = "4.6.6", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
testcontainers = "0.28.0"
# "process" только для тестов (F9: осиротевший дочерний процесс на таймауте
# теста нужно уметь убить через async Child/kill_on_drop) — прод-бинарь его
# не использует, поэтому фича не добавлена в [dependencies].
tokio = { version = "1", features = ["process"] }
