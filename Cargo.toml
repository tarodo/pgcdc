[package]
name = "pgcdc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
pg_walstream = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2.0.20"
async-trait = "0.1.92"
tracing = "0.1.44"
tokio-postgres = "0.7.18"
clap = { version = "4.6.6", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
libc = "0.2.189"
testcontainers = "0.28.0"
# "process" is for tests only (F9: an orphaned child process on a test
# timeout must be killable via async Child/kill_on_drop) — the production
# binary doesn't use it, so the feature isn't added to [dependencies].
tokio = { version = "1", features = ["process"] }
# Both already sit in the dependency tree via tokio-postgres; declared here
# only so the COPY test can drive tokio_postgres::CopyInSink directly
# (bytes::Bytes as its item type, futures_util::SinkExt for `.send()`).
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
