services:
  postgres:
    image: postgres:16-alpine
    container_name: pgcdc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Демо-профиль: не запускается обычным `docker compose up -d`, только
  # `docker compose --profile demo up -d pgcdc`. Слот и публикация уже
  # существуют к моменту старта — их создаёт docker/init.sql при первом
  # старте postgres, до того как этот сервис вообще получает шанс
  # подключиться. Это принципиально: если бы слота не было, крейт молча
  # создал бы его на текущей позиции WAL, и события, зафиксированные до
  # старта pgcdc, не пришли бы (docs/spike-findings.md).
  pgcdc:
    profiles: ["demo"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGCDC_DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      PGCDC_PUBLICATION: pgcdc_pub
      PGCDC_SLOT: pgcdc_slot
      PGCDC_OUTPUT: stdout
