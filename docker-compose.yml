services:
  postgres:
    image: postgres:16-alpine
    container_name: pgcdc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Demo profile: not started by a plain `docker compose up -d`, only by
  # `docker compose --profile demo up -d pgcdc`. The slot and the
  # publication already exist by the time this service starts — they are
  # created by docker/init.sql on the first start of postgres, before this
  # service ever gets a chance to connect. This matters: if the slot didn't
  # exist yet, the crate would silently create it at the current WAL
  # position, and events committed before pgcdc started would never arrive
  # (docs/spike-findings.md).
  pgcdc:
    profiles: ["demo"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGCDC_DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      PGCDC_PUBLICATION: pgcdc_pub
      PGCDC_SLOT: pgcdc_slot
      PGCDC_OUTPUT: stdout
