[env]
# Every integration test spins up its own Testcontainers Postgres; without
# an explicit cap, `cargo test` runs them all in parallel and this suite
# (with each test also launching a process on top of the container) already
# saturates Docker and the CPU on an ordinary machine. RUST_TEST_THREADS is
# read by Rust's built-in test harness.
RUST_TEST_THREADS = "4"
