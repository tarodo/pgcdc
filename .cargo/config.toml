[env]
# Каждый интеграционный тест поднимает свой Testcontainers Postgres; без
# явного предела `cargo test` гонит их все параллельно и на этом наборе (и
# тем более со следующим тестом, тоже поднимающим процесс и контейнер) уже
# упирается в Docker и CPU на обычной машине. RUST_TEST_THREADS читается
# встроенным тестовым harness'ом Rust.
RUST_TEST_THREADS = "4"
